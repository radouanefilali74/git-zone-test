name: Run App Test

on: [push, pull_request]

jobs:
  test-app:
    runs-on: ubuntu-latest

    steps:
      - name: Download repo code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run app.js
        run: node app.js
EOF